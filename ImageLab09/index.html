<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: forest;
                       groundColor: #FFFFFF;
                       groundColor2: #DDEEFF;
                       dressingColor: #FFFFFF;
                       skyType: color;
                       skyColor: #BBDFFF">
</a-entity>
      
<!-- SNOWMAN -->

<!-- Snowman's body -->
<a-sphere position="0 0.6 -5" radius="0.6" color="white"></a-sphere>
<a-sphere position="0 1.45 -5" radius="0.45" color="white"></a-sphere>
<a-sphere position="0 2.15 -5" radius="0.35" color="white"></a-sphere>

<!-- Eyes -->
<a-sphere position="-0.13 2.25 -4.69" radius="0.05" color="black"></a-sphere>
<a-sphere position="0.13 2.25 -4.69" radius="0.05" color="black"></a-sphere>

<!-- Carrot nose -->
<a-cone position="0 2.12 -4.55"
        radius-bottom="0.09"
        radius-top="0"
        height="0.4"
        rotation="90 0 0"
        color="orange">
</a-cone>

<!-- Buttons -->
<a-sphere position="0 1.55 -4.56" radius="0.05" color="black"></a-sphere>
<a-sphere position="0 1.35 -4.57" radius="0.05" color="black"></a-sphere>

<!-- Hat -->
<a-cylinder position="0 2.48 -5" radius="0.4" height="0.08" color="black"></a-cylinder>
<a-cylinder position="0 2.7 -5" radius="0.27" height="0.4" color="black"></a-cylinder>
    </a-scene>
  </body>
</html>
